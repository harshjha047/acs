name: acs

x-genieacs: &genieacs
  image: acs/genieacs:1.2.16
  build: ./genieacs
  restart: unless-stopped
  environment:
    GENIEACS_MONGODB_CONNECTION_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/genieacs?authSource=admin
    GENIEACS_EXT_DIR: /opt/genieacs/ext
    GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET}
  volumes:
    - ./ext:/opt/genieacs/ext:ro
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "2"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  genieacs-cwmp:
    <<: *genieacs
    command: genieacs-cwmp
    ports: ["7547:7547"]

  genieacs-nbi:
    <<: *genieacs
    command: genieacs-nbi
    ports: ["127.0.0.1:7557:7557"]

  genieacs-fs:
    <<: *genieacs
    command: genieacs-fs
    ports: ["127.0.0.1:7567:7567"]

  genieacs-ui:
    <<: *genieacs
    command: genieacs-ui
    ports: ["127.0.0.1:${GENIEACS_UI_PORT:-3000}:3000"]

  api:
    profiles: [prod]
    build: ../backend
    image: acs/api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/acs_app?authSource=admin
      GENIEACS_NBI_URL: http://genieacs-nbi:7557
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://${API_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
      genieacs-nbi:
        condition: service_started

  dashboard:
    profiles: [prod]
    build: ../dashboard
    image: acs/dashboard
    restart: unless-stopped
    depends_on: [api]

  caddy:
    profiles: [prod]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACS_DOMAIN: ${ACS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, dashboard, genieacs-cwmp]

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
