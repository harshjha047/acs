name: acs

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-genieacs: &genieacs
  image: acs/genieacs:1.2.16
  build: ./genieacs
  restart: unless-stopped
  logging: *logging
  environment:
    GENIEACS_MONGODB_CONNECTION_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/genieacs?authSource=admin
    GENIEACS_EXT_DIR: /opt/genieacs/ext
    GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET}
    GENIEACS_FORWARDED_HEADER: 172.16.0.0/12
  volumes:
    - ./ext:/opt/genieacs/ext:ro
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    logging: *logging
    command: ["--wiredTigerCacheSizeGB", "2"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  genieacs-cwmp:
    <<: *genieacs
    command: genieacs-cwmp
    ports: ["7547:7547"]

  genieacs-nbi:
    <<: *genieacs
    command: genieacs-nbi
    ports: ["127.0.0.1:7557:7557"]

  genieacs-fs:
    <<: *genieacs
    command: genieacs-fs
    ports: ["127.0.0.1:7567:7567"]

  genieacs-ui:
    <<: *genieacs
    command: genieacs-ui
    ports: ["127.0.0.1:${GENIEACS_UI_PORT:-3000}:3000"]

  api:
    profiles: [prod]
    build: ../backend
    image: acs/api
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/acs_app?authSource=admin
      GENIEACS_NBI_URL: http://genieacs-nbi:7557
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://${API_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SPEEDTEST_URL: http://${ACS_DOMAIN}/speedtest/50MB.bin
      SPEEDTEST_UPLOAD_BASE: http://${ACS_DOMAIN}/speedtest/upload
      UPLOAD_TEST_BYTES: ${UPLOAD_TEST_BYTES:-10485760}
      BACKUP_DIR: /backups
      CWMP_USER: ${CWMP_USER:-}
      CWMP_PASS: ${CWMP_PASS:-}
      MONITOR_INTERVAL_SEC: ${MONITOR_INTERVAL_SEC:-60}
      TELEMETRY_MIN_SEC: ${TELEMETRY_MIN_SEC:-300}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-30}
      ALERT_RX_WARN_DBM: ${ALERT_RX_WARN_DBM:--27}
      ALERT_RX_CRIT_DBM: ${ALERT_RX_CRIT_DBM:--29}
    volumes:
      - ${BACKUP_DIR:-/opt/acs/backups}:/backups:ro
    depends_on:
      mongo:
        condition: service_healthy
      genieacs-nbi:
        condition: service_started

  dashboard:
    profiles: [prod]
    build: ../dashboard
    image: acs/dashboard
    restart: unless-stopped
    logging: *logging
    depends_on: [api]

  caddy:
    profiles: [prod]
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACS_DOMAIN: ${ACS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./speedtest:/srv/speedtest:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, dashboard, genieacs-cwmp]

  cpe-sim:
    profiles: [sim]
    build: ./sim
    image: acs/cpe-sim
    restart: unless-stopped
    logging: *logging
    environment:
      ACS_URL: http://genieacs-cwmp:7547/
      SERIAL_OFFSET: ${SIM_SERIAL_OFFSET:-1}
      CWMP_USER: ${CWMP_USER:-}
      CWMP_PASS: ${CWMP_PASS:-}
    depends_on: [genieacs-cwmp]

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
